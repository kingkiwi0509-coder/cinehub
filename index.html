/* =========================================================
   API REQUEST
========================================================= */

async function apiRequest(endpoint, params = {}, signal = null) {

    const url = new URL(`${TMDB_API_BASE}${endpoint}`);

    url.searchParams.set("api_key", TMDB_KEY);

    Object.entries(params).forEach(([key, value]) => {

        if (
            value !== undefined &&
            value !== null &&
            value !== ""
        ) {
            url.searchParams.set(key, value);
        }

    });


    const controller = new AbortController();

    const timeout = setTimeout(() => {
        controller.abort();
    }, 15000);


    const abortFromOutside = () => {
        controller.abort();
    };


    if (signal) {

        if (signal.aborted) {
            controller.abort();
        } else {
            signal.addEventListener(
                "abort",
                abortFromOutside,
                { once: true }
            );
        }

    }


    try {

        const response = await fetch(
            url,
            {
                signal: controller.signal
            }
        );


        if (!response.ok) {

            throw new Error(
                `TMDB request failed: ${response.status}`
            );

        }


        return await response.json();

    } finally {

        clearTimeout(timeout);

        if (signal) {
            signal.removeEventListener(
                "abort",
                abortFromOutside
            );
        }

    }

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(message, type = "info") {

    statusMessage.textContent = message;

    statusMessage.classList.remove(
        "hidden",
        "border-red-800",
        "bg-red-950",
        "text-red-200"
    );


    if (type === "error") {

        statusMessage.classList.add(
            "bg-red-950",
            "border-red-800",
            "text-red-200"
        );

    } else {

        statusMessage.classList.add(
            "bg-zinc-900"
        );

    }

}


function hideStatus() {
    statusMessage.classList.add("hidden");
}


/* =========================================================
   NORMALIZE TMDB ITEM
========================================================= */

function normalizeItem(item, forcedType = null) {

    const type =
        forcedType ||
        item.media_type ||
        (
            item.first_air_date ||
            item.name ||
            item.original_name
                ? "tv"
                : "movie"
        );


    return {

        id: item.id,

        type,

        title:
            item.title ||
            item.name ||
            item.original_title ||
            item.original_name ||
            "Unknown Title",

        overview:
            item.overview ||
            "No description available.",

        poster:
            item.poster_path
                ? `${IMAGE_BASE}${item.poster_path}`
                : null,

        backdrop:
            item.backdrop_path
                ? `https://image.tmdb.org/t/p/original${item.backdrop_path}`
                : null,

        releaseDate:
            item.release_date ||
            item.first_air_date ||
            "",

        rating:
            typeof item.vote_average === "number"
                ? item.vote_average
                : 0

    };

}


/* =========================================================
   CARD HTML
========================================================= */

function createCard(item) {

    const card = document.createElement("div");

    card.className =
        "card bg-zinc-900 rounded-xl overflow-hidden cursor-pointer border border-zinc-800 hover:border-red-500";


    const image = document.createElement("img");

    image.className =
        "w-full aspect-[2/3] object-cover bg-zinc-800";

    image.alt = item.title;

    image.loading = "lazy";

    image.src =
        item.poster ||
        "https://placehold.co/500x750/18181b/ffffff?text=No+Poster";


    const content = document.createElement("div");

    content.className = "p-3";


    const title = document.createElement("h3");

    title.className =
        "font-semibold truncate";

    title.textContent = item.title;


    const info = document.createElement("div");

    info.className =
        "flex justify-between text-sm text-zinc-400 mt-2";


    const type = document.createElement("span");

    type.textContent =
        item.type === "tv"
            ? "TV"
            : "Movie";


    const rating = document.createElement("span");

    rating.textContent =
        `★ ${item.rating.toFixed(1)}`;


    info.appendChild(type);
    info.appendChild(rating);


    content.appendChild(title);
    content.appendChild(info);

    card.appendChild(image);
    card.appendChild(content);


    card.addEventListener(
        "click",
        () => selectMedia(item)
    );


    return card;

}


/* =========================================================
   RENDER CARDS
========================================================= */

function renderCards(items, append = false) {

    if (!append) {
        movieGrid.replaceChildren();
    }


    if (!items.length && !append) {

        const empty = document.createElement("div");

        empty.className =
            "col-span-full text-center py-16 text-zinc-400";

        empty.textContent =
            "No results found.";

        movieGrid.appendChild(empty);

        return;
    }


    const fragment = document.createDocumentFragment();


    items.forEach(item => {

        fragment.appendChild(
            createCard(item)
        );

    });


    movieGrid.appendChild(fragment);

}


/* =========================================================
   GET CATEGORY
========================================================= */

function getCategoryEndpoint(category) {

    switch (category) {

        case "movie":
            return "/movie/popular";

        case "tv":
            return "/tv/popular";

        case "anime":
            return "/discover/tv";

        case "trending":
        default:
            return "/trending/all/day";

    }

}


/* =========================================================
   LOAD CATEGORY
========================================================= */

async function loadCategory(
    category,
    page = 1,
    append = false
) {

    if (categoryController) {
        categoryController.abort();
    }


    categoryController =
        new AbortController();


    isLoading = true;

    loadMoreBtn.disabled = true;

    loadMoreBtn.textContent =
        "Loading...";


    try {

        const endpoint =
            getCategoryEndpoint(category);


        const params = {
            page
        };


        if (category === "anime") {

            params.with_genres = 16;
            params.with_original_language = "ja";

        }


        const data =
            await apiRequest(
                endpoint,
                params,
                categoryController.signal
            );


        const items =
            (data.results || [])
                .map(item =>
                    normalizeItem(
                        item,
                        category === "movie"
                            ? "movie"
                            : category === "tv" ||
                              category === "anime"
                                ? "tv"
                                : null
                    )
                );


        renderCards(
            items,
            append
        );


        currentCategory = category;
        currentPage = page;


        loadMoreBtn.classList.toggle(
            "hidden",
            !data.total_pages ||
            page >= data.total_pages
        );


        hideStatus();

    } catch (error) {

        if (error.name !== "AbortError") {

            console.error(error);

            if (!append) {
                movieGrid.replaceChildren();
            }

            showStatus(
                "Something went wrong while loading the catalog.",
                "error"
            );

        }

    } finally {

        isLoading = false;

        loadMoreBtn.disabled = false;

        loadMoreBtn.textContent =
            "Load More";

    }

}


/* =========================================================
   SEARCH
========================================================= */

async function searchMedia(
    query,
    page = 1,
    append = false
) {

    if (searchController) {
        searchController.abort();
    }


    searchController =
        new AbortController();


    isLoading = true;

    loadMoreBtn.disabled = true;

    loadMoreBtn.textContent =
        "Searching...";


    try {

        const data =
            await apiRequest(
                "/search/multi",
                {
                    query,
                    page,
                    include_adult: false
                },
                searchController.signal
            );


        const items =
            (data.results || [])
                .filter(
                    item =>
                        item.media_type === "movie" ||
                        item.media_type === "tv"
                )
                .map(item =>
                    normalizeItem(item)
                );


        renderCards(
            items,
            append
        );


        currentQuery = query;
        currentPage = page;


        resultsTitle.textContent =
            `Search results for "${query}"`;


        loadMoreBtn.classList.toggle(
            "hidden",
            !data.total_pages ||
            page >= data.total_pages
        );


        hideStatus();

    } catch (error) {

        if (error.name !== "AbortError") {

            console.error(error);

            showStatus(
                "Search failed. Try again.",
                "error"
            );

        }

    } finally {

        isLoading = false;

        loadMoreBtn.disabled = false;

        loadMoreBtn.textContent =
            "Load More";

    }

}


/* =========================================================
   LOAD MORE
========================================================= */

async function loadMore() {

    if (isLoading) return;


    const nextPage =
        currentPage + 1;


    if (currentQuery) {

        await searchMedia(
            currentQuery,
            nextPage,
            true
        );

    } else {

        await loadCategory(
            currentCategory,
            nextPage,
            true
        );

    }

}


/* =========================================================
   SELECT MEDIA
========================================================= */

async function selectMedia(item) {

    currentMedia = item;

    activeSeason = 1;
    activeEpisode = 1;


    playerTitle.textContent =
        item.title;


    playerModal.classList.remove(
        "hidden"
    );


    playerError.classList.add(
        "hidden"
    );


    buildProviderButtons();


    if (item.type === "tv") {

        episodeControls.classList.remove(
            "hidden"
        );

        await loadTVDetails(item.id);

    } else {

        episodeControls.classList.add(
            "hidden"
        );

        updatePlayerSource();

    }

}


/* =========================================================
   LOAD TV DETAILS
========================================================= */

async function loadTVDetails(tvId) {

    try {

        const data =
            await apiRequest(
                `/tv/${tvId}`
            );


        const seasons =
            (data.seasons || [])
                .filter(
                    season =>
                        season.season_number >= 0
                );


        seasonSelect.replaceChildren();


        seasons.forEach(season => {

            const option =
                document.createElement("option");

            option.value =
                season.season_number;

            option.textContent =
                season.name ||
                `Season ${season.season_number}`;

            seasonSelect.appendChild(
                option
            );

        });


        if (!seasons.length) {

            showPlayerError(
                "No seasons were found for this show."
            );

            return;
        }


        const requestedSeason =
            seasons.find(
                season =>
                    season.season_number ===
                    Number(activeSeason)
            );


        activeSeason =
            requestedSeason
                ? requestedSeason.season_number
                : seasons[0].season_number;


        seasonSelect.value =
            activeSeason;


        await loadEpisodes(
            currentMedia.id,
            activeSeason
        );


    } catch (error) {

        console.error(error);

        showPlayerError(
            "Could not load the show's seasons."
        );

    }

}


/* =========================================================
   LOAD EPISODES
========================================================= */

async function loadEpisodes(
    tvId,
    seasonNumber
) {

    try {

        const data =
            await apiRequest(
                `/tv/${tvId}/season/${seasonNumber}`
            );


        const episodes =
            data.episodes || [];


        episodeSelect.replaceChildren();
        episodeGrid.replaceChildren();


        episodes.forEach(
            episode => {

                const option =
                    document.createElement("option");

                option.value =
                    episode.episode_number;

                option.textContent =
                    `Episode ${episode.episode_number}`;

                episodeSelect.appendChild(
                    option
                );


                const button =
                    document.createElement("button");

                button.type = "button";

                button.className =
                    "episode-btn px-3 py-2 bg-zinc-800 rounded-lg hover:bg-zinc-700";


                button.textContent =
                    episode.episode_number;


                button.dataset.episode =
                    episode.episode_number;


                button.addEventListener(
                    "click",
                    () => {

                        activeEpisode =
                            Number(
                                episode.episode_number
                            );

                        episodeSelect.value =
                            activeEpisode;

                        updateEpisodeButtons();

                        updatePlayerSource();

                    }
                );


                episodeGrid.appendChild(
                    button
                );

            }
        );


        if (episodes.length) {

            activeEpisode =
                episodes[0].episode_number;

            episodeSelect.value =
                activeEpisode;

        }


        updateEpisodeButtons();

        updatePlayerSource();


    } catch (error) {

        console.error(error);

        showPlayerError(
            "Could not load episodes."
        );

    }

}


/* =========================================================
   EPISODE BUTTON STATE
========================================================= */

function updateEpisodeButtons() {

    document
        .querySelectorAll(".episode-btn")
        .forEach(button => {

            button.classList.toggle(
                "active",
                Number(button.dataset.episode) ===
                Number(activeEpisode)
            );

        });

}


/* =========================================================
   BUILD PROVIDER BUTTONS
========================================================= */

function buildProviderButtons() {

    providerContainer.replaceChildren();


    Object.entries(
        VIDEO_PROVIDERS
    ).forEach(
        ([providerId, provider]) => {

            const button =
                document.createElement("button");


            button.type = "button";

            button.className =
                "provider-btn px-4 py-2 bg-zinc-800 rounded-lg hover:bg-zinc-700 whitespace-nowrap";


            button.dataset.provider =
                providerId;


            button.textContent =
                provider.name;


            button.addEventListener(
                "click",
                () => {

                    selectProvider(
                        providerId
                    );

                }
            );


            providerContainer.appendChild(
                button
            );

        }
    );


    updateProviderButtons();

}


/* =========================================================
   SELECT PROVIDER
========================================================= */

function selectProvider(
    providerId
) {

    if (
        !VIDEO_PROVIDERS[
            providerId
        ]
    ) {
        return;
    }


    activeProvider =
        providerId;


    updateProviderButtons();

    updatePlayerSource();

}


/* =========================================================
   PROVIDER BUTTON STATE
========================================================= */

function updateProviderButtons() {

    document
        .querySelectorAll(
            "[data-provider]"
        )
        .forEach(button => {

            button.classList.toggle(
                "active",
                button.dataset.provider ===
                activeProvider
            );

        });

}


/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayerSource() {

    if (!currentMedia) {
        return;
    }


    const provider =
        VIDEO_PROVIDERS[
            activeProvider
        ];


    if (!provider) {

        showPlayerError(
            "Video provider not found."
        );

        return;
    }


    let url = "";


    try {

        url =
            provider.buildUrl({

                type:
                    currentMedia.type,

                id:
                    currentMedia.id,

                season:
                    currentMedia.type === "tv"
                        ? Number(activeSeason)
                        : null,

                episode:
                    currentMedia.type === "tv"
                        ? Number(activeEpisode)
                        : null

            });

    } catch (error) {

        console.error(error);

        showPlayerError(
            "Could not create the playback URL."
        );

        return;

    }


    if (!url) {

        playerFrame.src = "";

        showPlayerError(
            `${provider.name} is not configured with an authorized playback URL.`
        );

        return;

    }


    playerError.classList.add(
        "hidden"
    );


    playerFrame.src = url;

}


/* =========================================================
   PLAYER ERROR
========================================================= */

function showPlayerError(message) {

    playerError.textContent =
        message;

    playerError.classList.remove(
        "hidden"
    );

}


/* =========================================================
   CLOSE PLAYER
========================================================= */

function closePlayerModal() {

    playerFrame.src = "";

    currentMedia = null;

    playerModal.classList.add(
        "hidden"
    );

}


/* =========================================================
   RESOLVE CUSTOM ID
========================================================= */

async function resolveExternalId(
    rawId
) {

    const id =
        rawId.trim();


    if (!id) {

        throw new Error(
            "Enter an IMDb ID or TMDB ID."
        );

    }


    /*
        IMDb ID
        Example:
        tt1234567
    */

    if (
        /^tt\d+$/i.test(id)
    ) {

        const result =
            await apiRequest(
                `/find/${encodeURIComponent(id)}`,
                {
                    external_source: "imdb_id"
                }
            );


        if (
            result.movie_results &&
            result.movie_results.length
        ) {

            return normalizeItem(
                result.movie_results[0],
                "movie"
            );

        }


        if (
            result.tv_results &&
            result.tv_results.length
        ) {

            return normalizeItem(
                result.tv_results[0],
                "tv"
            );

        }


        throw new Error(
            "IMDb ID was not found."
        );

    }


    /*
        TMDB numeric ID

        We check movie first, then TV.
    */

    if (
        /^\d+$/.test(id)
    ) {

        try {

            const movie =
                await apiRequest(
                    `/movie/${id}`
                );


            if (movie?.id) {

                return normalizeItem(
                    movie,
                    "movie"
                );

            }

        } catch {
            // Try TV below.
        }


        try {

            const tv =
                await apiRequest(
                    `/tv/${id}`
                );


            if (tv?.id) {

                return normalizeItem(
                    tv,
                    "tv"
                );

            }

        } catch {
            // ID wasn't found.
        }


        throw new Error(
            "TMDB ID was not found."
        );

    }


    throw new Error(
        "Use an IMDb ID such as tt1234567 or a numeric TMDB ID."
    );

}


/* =========================================================
   OPEN CUSTOM ID
========================================================= */

async function playManualId() {

    const rawId =
        customIdInput.value.trim();


    idError.classList.add(
        "hidden"
    );


    try {

        const item =
            await resolveExternalId(
                rawId
            );


        idModal.classList.add(
            "hidden"
        );


        customIdInput.value =
            "";


        await selectMedia(
            item
        );


    } catch (error) {

        idError.textContent =
            error.message;


        idError.classList.remove(
            "hidden"
        );

    }

}


/* =========================================================
   CATEGORY BUTTONS
========================================================= */

document
    .querySelectorAll(
        ".category-btn"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            async () => {

                document
                    .querySelectorAll(
                        ".category-btn"
                    )
                    .forEach(btn => {

                        btn.classList.remove(
                            "bg-red-600"
                        );

                        btn.classList.add(
                            "bg-zinc-800"
                        );

                    });


                button.classList.remove(
                    "bg-zinc-800"
                );

                button.classList.add(
                    "bg-red-600"
                );


                currentQuery = "";

                currentPage = 1;

                currentCategory =
                    button.dataset.category;


                const names = {
                    trending: "Trending",
                    movie: "Movies",
                    tv: "TV Series",
                    anime: "Anime"
                };


                resultsTitle.textContent =
                    names[
                        currentCategory
                    ] || "CinemaHub";


                await loadCategory(
                    currentCategory,
                    1,
                    false
                );

            }
        );

    });


/* =========================================================
   SEARCH
========================================================= */

async function performSearch() {

    const query =
        searchInput.value.trim();


    if (!query) {

        currentQuery = "";

        currentPage = 1;

        resultsTitle.textContent =
            "Trending";


        await loadCategory(
            "trending",
            1,
            false
        );

        return;
    }


    await searchMedia(
        query,
        1,
        false
    );

}


searchBtn.addEventListener(
    "click",
    performSearch
);


searchInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            performSearch();

        }

    }
);


/* =========================================================
   LOAD MORE
========================================================= */

loadMoreBtn.addEventListener(
    "click",
    loadMore
);


/* =========================================================
   PLAYER EVENTS
========================================================= */

closePlayer.addEventListener(
    "click",
    closePlayerModal
);


playerModal.addEventListener(
    "click",
    event => {

        if (
            event.target === playerModal
        ) {

            closePlayerModal();

        }

    }
);


/* =========================================================
   SEASON CHANGE
========================================================= */

seasonSelect.addEventListener(
    "change",
    async () => {

        activeSeason =
            Number(
                seasonSelect.value
            );

        activeEpisode = 1;

        await loadEpisodes(
            currentMedia.id,
            activeSeason
        );

    }
);


/* =========================================================
   EPISODE CHANGE
========================================================= */

episodeSelect.addEventListener(
    "change",
    () => {

        activeEpisode =
            Number(
                episodeSelect.value
            );

        updateEpisodeButtons();

        updatePlayerSource();

    }
);


/* =========================================================
   CUSTOM ID MODAL
========================================================= */

cancelId.addEventListener(
    "click",
    () => {

        idModal.classList.add(
            "hidden"
        );

        idError.classList.add(
            "hidden"
        );

    }
);


openId.addEventListener(
    "click",
    playManualId
);


customIdInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            playManualId();

        }

    }
);


/* =========================================================
   ESCAPE KEY
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            if (
                !playerModal.classList.contains(
                    "hidden"
                )
            ) {

                closePlayerModal();

            }


            if (
                !idModal.classList.contains(
                    "hidden"
                )
            ) {

                idModal.classList.add(
                    "hidden"
                );

            }

        }

    }
);


/* =========================================================
   INITIAL LOAD
========================================================= */

loadCategory(
    "trending",
    1,
    false
);

</script>
