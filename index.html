<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CinemaHub - Movies, TV & Anime</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #09090b; }
    ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col font-sans selection:bg-red-600 selection:text-white">

  <!-- Top Navigation -->
  <header class="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur-md border-b border-zinc-800/80 px-4 lg:px-8 py-3.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      
      <!-- Brand Logo -->
      <div class="flex items-center gap-6">
        <a href="#" class="flex items-center gap-2 group">
          <div class="w-9 h-9 bg-red-600 rounded-lg flex items-center justify-center font-black text-xl text-white shadow-lg shadow-red-600/30 group-hover:scale-105 transition">
            ▶
          </div>
          <span class="text-xl font-black tracking-wider text-white">CINEMA<span class="text-red-600">HUB</span></span>
        </a>

        <!-- Main Category Tabs Only -->
        <nav class="hidden md:flex items-center gap-1 text-sm font-semibold text-zinc-400">
          <button id="tab-trending" onclick="switchTab('trending', this)" class="nav-tab px-3 py-1.5 rounded-lg text-white bg-zinc-800">Trending</button>
          <button id="tab-movie" onclick="switchTab('movie', this)" class="nav-tab px-3 py-1.5 rounded-lg hover:text-white hover:bg-zinc-900 transition">Movies</button>
          <button id="tab-tv" onclick="switchTab('tv', this)" class="nav-tab px-3 py-1.5 rounded-lg hover:text-white hover:bg-zinc-900 transition">TV Series</button>
          <button id="tab-anime" onclick="switchTab('anime', this)" class="nav-tab px-3 py-1.5 rounded-lg hover:text-white hover:bg-zinc-900 transition">Anime</button>
        </nav>
      </div>

      <!-- Quick Search Bar -->
      <div class="relative flex-1 max-w-md">
        <input 
          id="searchInput" 
          type="text" 
          placeholder="Search movies, TV shows, anime..." 
          class="w-full bg-zinc-900 border border-zinc-800 focus:border-red-600 rounded-full pl-10 pr-4 py-2 text-sm text-zinc-100 placeholder-zinc-500 focus:outline-none transition shadow-inner"
        >
        <span class="absolute left-3.5 top-2.5 text-zinc-500 text-sm">🔍</span>
      </div>

      <!-- Direct Manual ID Tool -->
      <button onclick="toggleManualModal()" class="text-xs bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 px-3 py-2 rounded-lg text-zinc-400 hover:text-zinc-200 transition hidden sm:inline-block">
        Custom ID
      </button>
    </div>
  </header>

  <!-- Video Player Section (Hidden until title clicked) -->
  <section id="playerContainer" class="hidden bg-black border-b border-zinc-800 py-6 px-4">
    <div class="max-w-6xl mx-auto space-y-4">
      
      <!-- Player Bar Controls -->
      <div class="flex flex-wrap items-center justify-between gap-3 bg-zinc-900/80 p-3 rounded-xl border border-zinc-800">
        <div class="flex items-center gap-3">
          <span id="playerTitle" class="font-bold text-base md:text-lg text-white">Select a title</span>
          <span class="text-xs bg-red-600/20 text-red-400 border border-red-500/30 px-2 py-0.5 rounded font-mono">HD</span>
        </div>

        <!-- Server Selector -->
        <div class="flex items-center gap-2">
          <span class="text-xs text-zinc-400 font-medium">Server:</span>
          <select id="serverSelect" onchange="updatePlayerSource()" class="bg-zinc-950 border border-zinc-700 text-xs rounded-lg px-2.5 py-1.5 text-zinc-200 focus:outline-none focus:border-red-600">
            <option value="vidsrc_to">VidSrc.to (Fast)</option>
            <option value="vidsrc_xyz">VidSrc.xyz (Mirror 1)</option>
            <option value="embed_su">Embed.su (Mirror 2)</option>
          </select>
          <button onclick="closePlayer()" class="text-zinc-400 hover:text-white bg-zinc-800 hover:bg-zinc-700 p-1.5 rounded-lg text-xs">✕ Close</button>
        </div>
      </div>

      <!-- Video Aspect Frame -->
      <div class="relative w-full aspect-video bg-zinc-950 rounded-xl overflow-hidden shadow-2xl border border-zinc-800">
        <iframe 
          id="videoIframe" 
          src="" 
          class="absolute inset-0 w-full h-full" 
          allowfullscreen 
          allow="autoplay; encrypted-media; fullscreen"
        ></iframe>
      </div>

      <!-- TV / Anime Episode Navigator -->
      <div id="episodeControls" class="hidden bg-zinc-900 border border-zinc-800 rounded-xl p-4 space-y-3">
        <div class="flex items-center justify-between">
          <h3 class="text-sm font-bold text-zinc-300">Select Season & Episode</h3>
          <div class="flex items-center gap-2">
            <label class="text-xs text-zinc-400">Season:</label>
            <select id="seasonSelect" onchange="generateEpisodeGrid()" class="bg-zinc-950 border border-zinc-700 text-xs rounded px-2 py-1 text-white"></select>
          </div>
        </div>
        <div id="episodeGrid" class="flex flex-wrap gap-2 max-h-36 overflow-y-auto pt-1"></div>
      </div>
    </div>
  </section>

  <!-- Media Catalog Grid -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 lg:p-8 space-y-6">
    <div class="flex items-center justify-between">
      <h2 id="sectionHeading" class="text-xl font-bold tracking-tight text-white flex items-center gap-2">
        <span class="w-2.5 h-2.5 rounded-full bg-red-600"></span> Trending Titles
      </h2>
      <span id="resultsCount" class="text-xs text-zinc-500">Auto-updating catalog</span>
    </div>

    <!-- Media Cards -->
    <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>

    <!-- Working Load More Titles Button -->
    <div class="flex justify-center pt-8 pb-12">
      <button 
        id="loadMoreBtn" 
        onclick="loadNextPage()" 
        class="bg-zinc-900 hover:bg-red-600 text-zinc-200 hover:text-white border border-zinc-800 hover:border-red-600 font-bold px-8 py-3 rounded-xl transition duration-200 flex items-center gap-2 shadow-lg hover:scale-105 active:scale-95"
      >
        <span>Load More Titles</span>
      </button>
    </div>
  </main>

  <!-- Manual ID Entry Modal -->
  <div id="manualModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-2xl max-w-md w-full p-6 space-y-4">
      <div class="flex justify-between items-center">
        <h3 class="font-bold text-lg">Direct ID Player</h3>
        <button onclick="toggleManualModal()" class="text-zinc-400 hover:text-white">✕</button>
      </div>
      <p class="text-xs text-zinc-400">Directly input an IMDb ID (e.g. tt0111161) or TMDb ID.</p>
      
      <div class="space-y-3">
        <select id="manualType" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-2 text-sm">
          <option value="movie">Movie</option>
          <option value="tv">TV Series / Anime</option>
        </select>
        <input id="manualId" type="text" placeholder="IMDb (tt...) or TMDb ID" class="w-full bg-zinc-950 border border-zinc-700 rounded-lg p-2 text-sm">
        <div class="grid grid-cols-2 gap-2">
          <input id="manualSeason" type="number" placeholder="Season" value="1" class="bg-zinc-950 border border-zinc-700 rounded-lg p-2 text-sm">
          <input id="manualEpisode" type="number" placeholder="Episode" value="1" class="bg-zinc-950 border border-zinc-700 rounded-lg p-2 text-sm">
        </div>
        <button onclick="playManualId()" class="w-full bg-red-600 hover:bg-red-700 font-bold py-2 rounded-lg text-sm transition">Launch Stream</button>
      </div>
    </div>
  </div>

  <footer class="border-t border-zinc-900 bg-zinc-950 py-6 text-center text-xs text-zinc-600 space-y-1">
    <p>CinemaHub Directory Prototype. Content indexation demo.</p>
    <p>We do not store or host any media files on our servers.</p>
  </footer>

  <!-- Application Engine -->
  <script>
    const TMDB_KEY = "8414ff0f9a8862700a8459461ae49692";
    let activeMedia = null;
    let activeSeason = 1;
    let activeEpisode = 1;

    let currentCategory = 'trending';
    let currentPage = 1;
    let currentQuery = '';

    window.addEventListener('DOMContentLoaded', () => {
      fetchCategory('trending', 1, false);

      let debounceTimer;
      document.getElementById('searchInput').addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        const query = e.target.value.trim();
        if (query.length > 2) {
          debounceTimer = setTimeout(() => {
            currentQuery = query;
            currentPage = 1;
            document.getElementById('sectionHeading').innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-red-600"></span> Results for "${query}"`;
            searchTMDB(query, 1, false);
          }, 400);
        } else if (query.length === 0) {
          currentQuery = '';
          currentPage = 1;
          switchTab('trending', document.getElementById('tab-trending'));
        }
      });
    });

    async function fetchCategory(category, page = 1, append = false) {
      let endpoint = '';
      if (category === 'trending') endpoint = `https://api.themoviedb.org/3/trending/all/day?api_key=${TMDB_KEY}&page=${page}`;
      if (category === 'movie') endpoint = `https://api.themoviedb.org/3/movie/popular?api_key=${TMDB_KEY}&page=${page}`;
      if (category === 'tv') endpoint = `https://api.themoviedb.org/3/tv/popular?api_key=${TMDB_KEY}&page=${page}`;
      if (category === 'anime') endpoint = `https://api.themoviedb.org/3/discover/tv?api_key=${TMDB_KEY}&with_genres=16&with_original_language=ja&page=${page}`;

      try {
        const res = await fetch(endpoint);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          renderCards(data.results.map(item => normalizeItem(item, category)), append);
        }
      } catch (err) {
        console.error("API Error", err);
      }
    }

    async function searchTMDB(query, page = 1, append = false) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_KEY}&query=${encodeURIComponent(query)}&page=${page}`);
        const data = await res.json();
        if (data.results && data.results.length > 0) {
          const filtered = data.results
            .filter(i => i.media_type === 'movie' || i.media_type === 'tv')
            .map(i => normalizeItem(i, i.media_type));
          renderCards(filtered, append);
        }
      } catch (e) {
        console.error("Search Error", e);
      }
    }

    // Called whenever "Load More Titles" is clicked
    function loadNextPage() {
      currentPage++;
      if (currentQuery) {
        searchTMDB(currentQuery, currentPage, true);
      } else {
        fetchCategory(currentCategory, currentPage, true);
      }
    }

    function normalizeItem(item, defaultType) {
      const isTv = item.media_type === 'tv' || defaultType === 'tv' || defaultType === 'anime';
      return {
        id: item.id,
        title: item.title || item.name || "Untitled",
        type: isTv ? 'tv' : 'movie',
        rating: item.vote_average ? item.vote_average.toFixed(1) : "7.5",
        year: (item.release_date || item.first_air_date || "").substring(0, 4) || "2024",
        poster_path: item.poster_path
      };
    }

    function renderCards(items, append = false) {
      const grid = document.getElementById('mediaGrid');
      if (!append) grid.innerHTML = '';

      items.forEach(item => {
        const posterUrl = item.poster_path 
          ? `https://image.tmdb.org/t/p/w500${item.poster_path}`
          : 'https://via.placeholder.com/500x750?text=No+Poster';

        const card = document.createElement('div');
        card.className = "group relative bg-zinc-900 rounded-xl overflow-hidden cursor-pointer border border-zinc-800/80 hover:border-red-600 transition duration-300 flex flex-col";
        card.onclick = () => selectMedia(item);

        card.innerHTML = `
          <div class="relative aspect-[2/3] overflow-hidden bg-zinc-950">
            <img src="${posterUrl}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
            <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-transparent to-transparent opacity-60"></div>
            
            <span class="absolute top-2 left-2 bg-red-600 text-[10px] font-black uppercase tracking-wider text-white px-1.5 py-0.5 rounded">
              ${item.type === 'tv' ? 'TV' : 'MOVIE'}
            </span>
            <span class="absolute top-2 right-2 bg-black/70 backdrop-blur-sm text-yellow-400 text-[11px] font-bold px-1.5 py-0.5 rounded flex items-center gap-1 border border-yellow-500/20">
              ★ ${item.rating}
            </span>

            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition duration-300">
              <div class="w-12 h-12 rounded-full bg-red-600 text-white flex items-center justify-center text-xl shadow-lg transform group-hover:scale-110 transition">
                ▶
              </div>
            </div>
          </div>

          <div class="p-3 flex flex-col flex-1 justify-between">
            <h3 class="text-xs md:text-sm font-bold text-zinc-100 line-clamp-1 group-hover:text-red-500 transition">${item.title}</h3>
            <p class="text-[11px] text-zinc-500 mt-1">${item.year}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function selectMedia(item) {
      activeMedia = item;
      activeSeason = 1;
      activeEpisode = 1;

      document.getElementById('playerContainer').classList.remove('hidden');
      document.getElementById('playerTitle').innerText = item.title;
      document.getElementById('playerContainer').scrollIntoView({ behavior: 'smooth' });

      const episodeControls = document.getElementById('episodeControls');
      if (item.type === 'tv') {
        episodeControls.classList.remove('hidden');
        setupSeasons(item.seasons || 3);
      } else {
        episodeControls.classList.add('hidden');
      }

      updatePlayerSource();
    }

    function setupSeasons(totalSeasons) {
      const select = document.getElementById('seasonSelect');
      select.innerHTML = '';
      for (let s = 1; s <= totalSeasons; s++) {
        const opt = document.createElement('option');
        opt.value = s;
        opt.innerText = `Season ${s}`;
        select.appendChild(opt);
      }
      generateEpisodeGrid();
    }

    function generateEpisodeGrid() {
      const season = document.getElementById('seasonSelect').value;
      activeSeason = season;
      const grid = document.getElementById('episodeGrid');
      grid.innerHTML = '';

      const totalEpisodes = 16;
      for (let e = 1; e <= totalEpisodes; e++) {
        const btn = document.createElement('button');
        btn.innerText = `EP ${e}`;
        btn.className = `text-xs px-3 py-1.5 rounded-lg border font-medium transition ${
          e === activeEpisode 
            ? 'bg-red-600 border-red-500 text-white' 
            : 'bg-zinc-950 border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-white'
        }`;
        btn.onclick = () => {
          activeEpisode = e;
          generateEpisodeGrid();
          updatePlayerSource();
        };
        grid.appendChild(btn);
      }
    }

    function updatePlayerSource() {
      if (!activeMedia) return;

      const server = document.getElementById('serverSelect').value;
      const iframe = document.getElementById('videoIframe');
      const id = activeMedia.id;
      let url = '';

      if (server === 'vidsrc_to') {
        url = activeMedia.type === 'movie' 
          ? `https://vidsrc.to/embed/movie/${id}`
          : `https://vidsrc.to/embed/tv/${id}/${activeSeason}/${activeEpisode}`;
      } else if (server === 'vidsrc_xyz') {
        url = activeMedia.type === 'movie'
          ? `https://vidsrc.xyz/embed/movie?tmdb=${id}`
          : `https://vidsrc.xyz/embed/tv?tmdb=${id}&season=${activeSeason}&episode=${activeEpisode}`;
      } else if (server === 'embed_su') {
        url = activeMedia.type === 'movie'
          ? `https://embed.su/embed/movie/${id}`
          : `https://embed.su/embed/tv/${id}/${activeSeason}/${activeEpisode}`;
      }

      iframe.src = url;
    }

    function closePlayer() {
      const iframe = document.getElementById('videoIframe');
      iframe.src = "";
      document.getElementById('playerContainer').classList.add('hidden');
      activeMedia = null;
    }

    function toggleManualModal() {
      document.getElementById('manualModal').classList.toggle('hidden');
    }

    function playManualId() {
      const type = document.getElementById('manualType').value;
      const id = document.getElementById('manualId').value.trim();
      const season = document.getElementById('manualSeason').value || 1;
      const episode = document.getElementById('manualEpisode').value || 1;

      if (!id) return alert("Enter an ID");

      selectMedia({
        id: id,
        title: `Manual ID: ${id}`,
        type: type,
        seasons: 5
      });
      activeSeason = season;
      activeEpisode = episode;
      updatePlayerSource();
      toggleManualModal();
    }

    function switchTab(tab, element) {
      currentCategory = tab;
      currentPage = 1;
      currentQuery = '';
      document.getElementById('searchInput').value = '';
      
      document.querySelectorAll('.nav-tab').forEach(b => {
        b.className = "nav-tab px-3 py-1.5 rounded-lg hover:text-white hover:bg-zinc-900 transition";
      });
      if (element) {
        element.className = "nav-tab px-3 py-1.5 rounded-lg text-white bg-zinc-800";
      }
      
      const titles = {
        trending: "Trending Titles",
        movie: "Popular Movies",
        tv: "Popular TV Shows",
        anime: "Top Anime Series"
      };
      document.getElementById('sectionHeading').innerHTML = `<span class="w-2.5 h-2.5 rounded-full bg-red-600"></span> ${titles[tab] || 'Titles'}`;
      
      fetchCategory(tab, 1, false);
    }
  </script>
</body>
</html>
