<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CinemaHub</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #09090b;
            color: white;
        }

        .card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        .provider-btn.active {
            background: #dc2626;
            color: white;
        }

        .episode-btn.active {
            background: #dc2626;
            color: white;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-hide {
            scrollbar-width: none;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <!-- TOP NAVBAR -->
    <header class="max-w-7xl mx-auto mb-8">
        <div class="flex flex-col md:flex-row md:items-center gap-4">
            <div class="text-2xl font-bold text-red-500 cursor-pointer" onclick="resetView()">
                CinemaHub
            </div>

            <div class="flex gap-2 overflow-x-auto scrollbar-hide">
                <button class="category-btn px-4 py-2 rounded-lg bg-red-600" data-category="trending">
                    Trending
                </button>
                <button class="category-btn px-4 py-2 rounded-lg bg-zinc-800" data-category="movie">
                    Movies
                </button>
                <button class="category-btn px-4 py-2 rounded-lg bg-zinc-800" data-category="tv">
                    TV Series
                </button>
                <button class="category-btn px-4 py-2 rounded-lg bg-zinc-800" data-category="anime">
                    Anime
                </button>
            </div>

            <div class="md:ml-auto flex gap-2">
                <input
                    id="searchInput"
                    type="text"
                    placeholder="Search movies, shows, anime..."
                    class="w-full md:w-72 px-4 py-2 rounded-lg bg-zinc-800 border border-zinc-700 outline-none focus:border-red-500"
                >
                <button id="searchBtn" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg">
                    Search
                </button>
                <button id="openCustomModalBtn" class="px-3 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg text-sm whitespace-nowrap">
                    Direct ID
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="max-w-7xl mx-auto">
        <!-- STATUS MESSAGE -->
        <div id="statusMessage" class="hidden mb-6 p-4 rounded-lg bg-zinc-900 border border-zinc-800 text-zinc-300"></div>

        <!-- PLAYER SECTION -->
        <section id="playerSection" class="hidden max-w-6xl mx-auto mb-12">
            <div class="flex justify-between items-center mb-4">
                <h2 id="playerTitle" class="text-xl md:text-2xl font-bold">Now Playing</h2>
                <button id="closePlayer" class="text-2xl px-3 py-1 rounded-lg bg-zinc-800 hover:bg-zinc-700 leading-none">
                    &times;
                </button>
            </div>

            <!-- PROVIDERS -->
            <div id="providerContainer" class="flex gap-2 mb-4 overflow-x-auto scrollbar-hide"></div>

            <!-- TV CONTROLS -->
            <div id="episodeControls" class="hidden mb-4 p-4 rounded-lg bg-zinc-900 border border-zinc-800">
                <div class="flex flex-col sm:flex-row gap-3">
                    <select id="seasonSelect" class="px-4 py-2 bg-zinc-800 rounded-lg border border-zinc-700 outline-none"></select>
                    <select id="episodeSelect" class="px-4 py-2 bg-zinc-800 rounded-lg border border-zinc-700 outline-none"></select>
                </div>
                <div id="episodeGrid" class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-2 mt-4"></div>
            </div>

            <!-- IFRAME PLAYER -->
            <div class="aspect-video bg-black rounded-xl overflow-hidden border border-zinc-800">
                <iframe
                    id="playerFrame"
                    class="w-full h-full"
                    src=""
                    allowfullscreen
                    referrerpolicy="origin"
                    sandbox="allow-scripts allow-same-origin allow-forms">
                </iframe>
            </div>

            <div id="playerError" class="hidden mt-4 p-4 rounded-lg bg-red-950 border border-red-800 text-red-200"></div>
        </section>

        <!-- GRID SECTION -->
        <section id="catalogSection">
            <div id="resultsTitle" class="text-2xl font-bold mb-6">Trending</div>
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5"></div>
            <div class="flex justify-center mt-8">
                <button id="loadMoreBtn" class="px-6 py-3 bg-zinc-800 hover:bg-zinc-700 rounded-lg">
                    Load More
                </button>
            </div>
        </section>
    </main>

    <!-- CUSTOM ID MODAL -->
    <div id="customIdModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-zinc-900 border border-zinc-800 rounded-xl p-6 shadow-2xl">
            <h2 class="text-xl font-bold mb-4">Open Custom ID</h2>

            <input
                id="customIdInput"
                type="text"
                placeholder="IMDb ID (e.g. tt0111161) or TMDB ID"
                class="w-full px-4 py-3 bg-zinc-800 rounded-lg border border-zinc-700 outline-none text-white focus:border-red-500"
            >

            <div class="flex gap-4 mt-3">
                <label class="flex items-center gap-2 cursor-pointer text-sm">
                    <input type="radio" name="mediaType" value="movie" checked class="accent-red-600"> Movie
                </label>
                <label class="flex items-center gap-2 cursor-pointer text-sm">
                    <input type="radio" name="mediaType" value="tv" class="accent-red-600"> TV Show
                </label>
            </div>

            <div class="flex justify-end gap-2 mt-6">
                <button id="cancelId" class="px-4 py-2 bg-zinc-800 hover:bg-zinc-700 rounded-lg">
                    Cancel
                </button>
                <button id="openId" class="px-4 py-2 bg-red-600 hover:bg-red-700 rounded-lg">
                    Open
                </button>
            </div>

            <div id="idError" class="hidden mt-4 text-sm text-red-400"></div>
        </div>
    </div>

    <!-- APPLICATION SCRIPT -->
    <script>
        /* =========================================================
           VIDEO PROVIDERS
        ========================================================= */
        const VIDEO_PROVIDERS = {
            provider1: {
                name: "VidSrc",
                buildUrl({ type, id, season, episode }) {
                    if (type === "movie") {
                        return `https://vidsrc.to/embed/movie/${encodeURIComponent(id)}`;
                    }
                    if (type === "tv") {
                        return `https://vidsrc.to/embed/tv/${encodeURIComponent(id)}/${encodeURIComponent(season || 1)}/${encodeURIComponent(episode || 1)}`;
                    }
                    return "";
                }
            },
            provider2: {
                name: "VidSrc XYZ",
                buildUrl({ type, id, season, episode }) {
                    if (type === "movie") {
                        return `https://vidsrc.xyz/embed/movie/${encodeURIComponent(id)}`;
                    }
                    if (type === "tv") {
                        return `https://vidsrc.xyz/embed/tv/${encodeURIComponent(id)}/${encodeURIComponent(season || 1)}/${encodeURIComponent(episode || 1)}`;
                    }
                    return "";
                }
            },
            provider3: {
                name: "Embed SU",
                buildUrl({ type, id, season, episode }) {
                    if (type === "movie") {
                        return `https://embed.su/embed/movie/${encodeURIComponent(id)}`;
                    }
                    if (type === "tv") {
                        return `https://embed.su/embed/tv/${encodeURIComponent(id)}/${encodeURIComponent(season || 1)}/${encodeURIComponent(episode || 1)}`;
                    }
                    return "";
                }
            }
        };

        // Active State
        let activeProvider = "provider1";
        let currentMedia = {
            id: null,
            type: "movie",
            title: "",
            season: 1,
            episode: 1
        };

        // DOM Elements
        const playerSection = document.getElementById("playerSection");
        const playerFrame = document.getElementById("playerFrame");
        const playerTitle = document.getElementById("playerTitle");
        const providerContainer = document.getElementById("providerContainer");
        const closePlayerBtn = document.getElementById("closePlayer");
        const customIdModal = document.getElementById("customIdModal");
        const openCustomModalBtn = document.getElementById("openCustomModalBtn");
        const cancelIdBtn = document.getElementById("cancelId");
        const openIdBtn = document.getElementById("openId");
        const customIdInput = document.getElementById("customIdInput");
        const idError = document.getElementById("idError");
        const episodeControls = document.getElementById("episodeControls");

        // Render Provider Buttons
        function setupProviders() {
            providerContainer.innerHTML = "";
            Object.entries(VIDEO_PROVIDERS).forEach(([key, prov]) => {
                const btn = document.createElement("button");
                btn.className = `provider-btn px-4 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm font-medium transition ${key === activeProvider ? "active" : ""}`;
                btn.textContent = prov.name;
                btn.onclick = () => {
                    activeProvider = key;
                    document.querySelectorAll(".provider-btn").forEach(b => b.classList.remove("active"));
                    btn.classList.add("active");
                    updatePlayer();
                };
                providerContainer.appendChild(btn);
            });
        }

        // Update iframe source
        function updatePlayer() {
            if (!currentMedia.id) return;

            const provider = VIDEO_PROVIDERS[activeProvider];
            if (provider) {
                const url = provider.buildUrl(currentMedia);
                playerFrame.src = url;
            }
        }

        // Open Player View
        function openMedia({ id, type, title, season = 1, episode = 1 }) {
            currentMedia = { id, type, title: title || id, season, episode };
            playerTitle.textContent = currentMedia.title;

            if (type === "tv") {
                episodeControls.classList.remove("hidden");
            } else {
                episodeControls.classList.add("hidden");
            }

            setupProviders();
            updatePlayer();
            playerSection.classList.remove("hidden");
            playerSection.scrollIntoView({ behavior: "smooth" });
        }

        // Close Player View
        closePlayerBtn.onclick = () => {
            playerFrame.src = "";
            playerSection.classList.add("hidden");
        };

        // Modal Controls
        openCustomModalBtn.onclick = () => {
            customIdModal.classList.remove("hidden");
            customIdInput.focus();
        };

        cancelIdBtn.onclick = () => {
            customIdModal.classList.add("hidden");
            idError.classList.add("hidden");
            customIdInput.value = "";
        };

        openIdBtn.onclick = () => {
            const rawId = customIdInput.value.trim();
            if (!rawId) {
                idError.textContent = "Please enter a valid TMDB or IMDb ID.";
                idError.classList.remove("hidden");
                return;
            }

            const mediaType = document.querySelector('input[name="mediaType"]:checked').value;
            idError.classList.add("hidden");
            customIdModal.classList.add("hidden");

            openMedia({
                id: rawId,
                type: mediaType,
                title: `${mediaType.toUpperCase()}: ${rawId}`
            });

            customIdInput.value = "";
        };

        // Initialize on load
        document.addEventListener("DOMContentLoaded", () => {
            setupProviders();
        });
    </script>
</body>
</html>
